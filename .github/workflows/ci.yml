name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://yachenyi.com

      - name: Verify generated site
        run: npm run verify:build
        env:
          EXPECTED_SITE_ORIGIN: https://yachenyi.com
